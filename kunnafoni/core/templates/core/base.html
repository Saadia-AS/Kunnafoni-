<!-- core/templates/core/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kunnafoni{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/base.css' %}">
</head>
<body>
    <div class="conteneur">
        <header>
            <nav style="display: flex; justify-content: space-between; align-items: center;">
                <a href="{% url 'accueil' %}" style="text-decoration: none; color: var(--accent); font-weight: bold; font-size: 20px;">
                    Kunnafoni
                </a>
                
                <div>
                    {% if request.user.is_authenticated %}
                        <!-- Menu visible uniquement si connecté (Page 2) -->
                        <a href="{% url 'infos' %}" style="color: var(--texte); text-decoration: none; margin-right: var(--s); font-size: 16px;">🔍 Infos</a>
                        
                        <!-- Bouton Déconnexion discret mais accessible -->
                        <a href="{% url 'deconnexion' %}" style="color: var(--attention); text-decoration: none; font-size: 16px; font-weight: bold;">❌ Quitter</a>
                    {% else %}
                        <!-- Liens visibles si visiteur anonyme -->
                        <a href="{% url 'connexion' %}" style="color: var(--accent); text-decoration: none; font-size: 16px;">Connexion</a>
                    {% endif %}
                </div>
            </nav>
        </header>

        <main>
            {% block content %}
            
            {% endblock %}
        </main>

        <footer>
            <p style="color: var(--discret); font-size: 14px; text-align: center; margin-top: var(--l);">
                &copy; 2026 Kunnafoni - Projet de fin de stage
            </p>
        </footer>
    </div>
</body>
</html>
